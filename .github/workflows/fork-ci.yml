name: Fork Windows CI

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'SaltedDCat/Win-CodexBar'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: pwsh
        run: |
          $rust = (Get-Content -Raw -LiteralPath scripts/circleci-pinned-rust.txt).Trim()
          rustup toolchain install $rust --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Could not install Rust $rust." }
          rustup default $rust

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop-tauri/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Run the Windows CI slice
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/local-check.ps1 -Slice ci
